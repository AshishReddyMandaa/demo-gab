name: Status Check Practice

on:
  push:
    branches:
      - devops-practice
  workflow_dispatch:

jobs:
  status-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Successful Step
        run: echo "This step succeeds"

      - name: Run on Success
        if: success()
        run: echo "Previous step succeeded"

      - name: Run on Failure
        if: failure()
        run: echo "A previous step failed"

      - name: Always Run
        if: always()
        run: echo "This step runs regardless"
