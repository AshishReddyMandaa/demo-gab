name: Conditions Practice

on:
  push:
    branches:
      - devops-practice
  workflow_dispatch:

jobs:
  conditions:
    runs-on: ubuntu-latest
    steps:
      - name: Always Run
        run: echo "This step runs."

      - name: Run Only on Push
        if: github.event_name == 'push'
        run: echo "This is a push event."

      - name: Run Only on Manual Trigger
        if: github.event_name == 'workflow_dispatch'
        run: echo "This is a manual run."

      - name: Run Only on devops-practice
        if: github.ref == 'refs/heads/devops-practice'
        run: echo "We are on the practice branch."
