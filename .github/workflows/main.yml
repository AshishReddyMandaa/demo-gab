
name: Enterprise CI Pipeline

on:
  push:
    branches:
      - main
      - master
      - develop
      - devops-practice
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  build:
    name: Build React Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Verify Installed Packages
        run: npm ls

      - name: Run Tests
        run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Build React Application
        run: npm run build

      - name: My First Practice Job
        run: echo "Hello Ashish! My GitHub Actions job is running."

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: react-build
          path: build/
          retention-days: 7
