name: Artifact Practice

on:
  push:
    branches:
      - devops-practice
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Build Directory
        run: |
          mkdir -p build/config

          echo "Application build completed" > build/app.txt
          echo "Version 1.0.0" > build/version.txt
          echo "Environment=dev" > build/config/app-config.txt

      - name: Show Build Files
        run: |
          echo "Build files:"
          find build -type f -print

      - name: Upload Build Directory
        uses: actions/upload-artifact@v4
        with:
          name: application-build
          path: build/
          retention-days: 5

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: application-build
          path: downloaded-build

      - name: Show Downloaded Files
        run: |
          echo "Downloaded files:"
          find downloaded-build -type f -print

      - name: Read Build Files
        run: |
          echo "Application:"
          cat downloaded-build/app.txt

          echo "Version:"
          cat downloaded-build/version.txt

          echo "Configuration:"
          cat downloaded-build/config/app-config.txt
